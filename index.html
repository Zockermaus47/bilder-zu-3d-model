<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Scan Studio</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <section class="hero">
      <div class="hero-copy">
        <p class="eyebrow">3D Scan Studio</p>
        <h1>Objekte mit dem Handy aufnehmen</h1>
        <p class="lead">
          Nimm mehrere Ansichten eines Objekts auf, speichere sie lokal und bereite dein 3D-Projekt vor.
        </p>

        <div class="meta-row">
          <div class="meta-card">
            <span class="meta-label">Bilder</span>
            <strong id="imageCount">0</strong>
          </div>
          <div class="meta-card">
            <span class="meta-label">Kamera</span>
            <strong id="cameraStateText">Inaktiv</strong>
          </div>
          <div class="meta-card">
            <span class="meta-label">Status</span>
            <strong id="cameraStatus">Kamera aus</strong>
          </div>
        </div>

        <div class="button-row">
          <button id="startCameraBtn" class="primary-btn">Kamera starten</button>
          <button id="stopCameraBtn" class="secondary-btn">Kamera stoppen</button>
          <button id="captureBtn" class="primary-btn">Foto aufnehmen</button>
          <button id="openUploadBtn" class="secondary-btn">Bilder wählen</button>
          <button id="clearBtn" class="danger-btn">Alle löschen</button>
          <button id="downloadJsonBtn" class="secondary-btn">JSON exportieren</button>
        </div>

        <input id="fileInput" type="file" accept="image/*" multiple hidden />
      </div>
    </section>

    <section class="camera-section reveal">
      <div class="camera-frame">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="captureCanvas" hidden></canvas>
      </div>
    </section>

    <section class="gallery-section reveal">
      <h2>Aufnahmen</h2>
      <div id="shotsGrid" class="shots-grid"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
