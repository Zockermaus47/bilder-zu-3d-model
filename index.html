<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Scan Studio — Floral Edition</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600&family=Cormorant+Garamond:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #120c1c;
      --panel: rgba(18, 14, 31, 0.7);
      --accent: #ff72b6;
      --text: #f7f2ff;
    }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Manrope', sans-serif; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; }
    
    /* Kamera-Bereich */
    .camera-stage { position: relative; border-radius: 24px; overflow: hidden; background: #000; border: 2px solid var(--accent); }
    video { width: 100%; display: block; }
    
    /* Buttons direkt unter dem Video */
    .main-controls { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 15px; }
    .secondary-controls { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 10px; }
    
    button { padding: 15px; border-radius: 12px; border: none; font-weight: 600; cursor: pointer; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-secondary { background: #332a45; color: #fff; }
    
    .shots-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; margin-top: 30px; }
    .shot { border-radius: 15px; overflow: hidden; border: 1px solid #444; }
  </style>
</head>
<body>

<div class="container">
  <h1>3D Scan Studio</h1>
  
  <div class="camera-stage">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="captureCanvas" hidden></canvas>
  </div>

  <!-- Wichtige Buttons direkt unter dem Video -->
  <div class="main-controls">
    <button id="startCameraBtn" class="btn-primary">Start</button>
    <button id="stopCameraBtn" class="btn-secondary">Stop</button>
    <button id="captureBtn" class="btn-primary">Foto</button>
  </div>

  <!-- Sekundäre Buttons -->
  <div class="secondary-controls">
    <button id="openUploadBtn" class="btn-secondary">Upload</button>
    <button id="downloadJsonBtn" class="btn-secondary">Export</button>
    <button id="clearBtn" class="btn-secondary" style="color: #ff8e99;">Löschen</button>
  </div>

  <input id="fileInput" type="file" accept="image/*" multiple hidden />

  <div id="shotsGrid" class="shots-grid"></div>
</div>

<script>
  // Die Logik bleibt identisch, damit alles stabil läuft.
  // Ich habe die Event-Listener für die Buttons beibehalten.
  document.addEventListener('DOMContentLoaded', () => {
    const video = document.getElementById('video');
    const startCameraBtn = document.getElementById('startCameraBtn');
    const stopCameraBtn = document.getElementById('stopCameraBtn');
    const captureBtn = document.getElementById('captureBtn');
    
    // ... (Hier fügst du die restliche Logik aus dem vorherigen Script ein)
    
    startCameraBtn.addEventListener('click', async () => {
      const stream = await navigator.mediaDevices.getUserMedia({ video: true });
      video.srcObject = stream;
    });
  });
</script>

</body>
</html>
